[project]
name = "ragas-jev"
version = "0.1.0"
description = "RAGAS-style RAG evaluation with JEV as the primary judge"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ady95" }]
keywords = ["rag", "evaluation", "ragas", "llm-as-a-judge", "faithfulness", "hallucination", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Korean",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typesafe-sdk>=0.1",
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/ady95/ragas-jev"
Repository = "https://github.com/ady95/ragas-jev"
Issues = "https://github.com/ady95/ragas-jev/issues"
Documentation = "https://github.com/ady95/ragas-jev/tree/main/docs"

[project.scripts]
ragas-jev = "ragas_jev.cli:app"

[dependency-groups]
benchmark = [
    "langchain-community<0.4",
    "pyarrow>=25.0.1",
    "ragas>=0.4.3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
embeddings = [
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragas_jev"]

[tool.hatch.build.targets.sdist]
# Source, tests, and the benchmark scripts the tests import; docs and images stay on GitHub.
include = ["/src", "/tests", "/benchmark", "/README.md", "/LICENSE", "/.env.example"]
exclude = ["__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real external APIs (excluded by default)"]
addopts = "-m 'not live'"
