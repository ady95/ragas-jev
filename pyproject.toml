[project]
name = "ragas-jev"
version = "0.1.0"
description = "RAGAS-style RAG evaluation with JEV as the primary judge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.1",
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
]

[project.scripts]
ragas-jev = "ragas_jev.cli:app"

[dependency-groups]
benchmark = [
    "langchain-community<0.4",
    "pyarrow>=25.0.1",
    "ragas>=0.4.3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragas_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real external APIs (excluded by default)"]
addopts = "-m 'not live'"
